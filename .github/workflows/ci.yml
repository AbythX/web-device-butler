name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer commit on the same branch makes the run of the older one pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the browsers of the specs that run against the real APIs
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # format, lint, types, every spec and the build
      - run: pnpm run check
