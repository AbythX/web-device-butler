name: Release

# Packages a release and publishes it to the packages of this repository (GitHub Packages). It runs when a release is
# published by hand, and when the CalVer workflow starts it for the release it created. The version is the tag of the
# release without its `v`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of an existing release, for example v2026.10.0
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Read the version from the tag
        run: |
          version=${TAG#v}
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::The tag '$TAG' is not a version like v2026.10.0."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile

      # GitHub Packages only takes a package in the scope of the owner of the repository. The name, the version and
      # the registry only go into the package that is published; the repository keeps its package.json.
      - name: Build the package
        run: |
          npm pkg delete private
          npm pkg set \
            name="@${GITHUB_REPOSITORY_OWNER,,}/web-device-butler" \
            version="$VERSION" \
            repository.type=git \
            repository.url="git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            publishConfig.registry=https://npm.pkg.github.com
          pnpm run build
          pnpm pack --pack-destination package

      # the `./` matters: npm takes `package/name.tgz` for a repository on GitHub
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish ./package/*.tgz

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" package/*.tgz --clobber
